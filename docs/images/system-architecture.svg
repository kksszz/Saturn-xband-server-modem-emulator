<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title description">
  <title id="title">Saturn XBAND Server / Modem Emulator 構成図</title>
  <desc id="description">中央上のXBANDサーバーと左右中央のモデムエミュレーターを双方向通信で接続し、各モデムを左右下のYMIR等のエミュレーターに接続する構成。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52677f"/>
    </marker>
  </defs>
  <rect width="960" height="520" rx="20" fill="#f5f8fc"/>
  <g fill="none" stroke="#52677f" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M 380 152 L 240 236"/>
    <path d="M 580 152 L 720 236"/>
    <path d="M 240 328 L 240 398"/>
    <path d="M 720 328 L 720 398"/>
  </g>
  <g font-family="'Yu Gothic', 'Meiryo', 'Noto Sans JP', sans-serif" text-anchor="middle">
    <rect x="310" y="42" width="340" height="104" rx="14" fill="#183a60"/>
    <text x="480" y="85" fill="#ffffff" font-size="26" font-weight="700">XBAND サーバー</text>
    <text x="480" y="118" fill="#d6e6f7" font-size="17">メール・マッチング・度数・ポイント</text>
    <text x="260" y="196" fill="#435b74" font-size="17">TCP / JSON</text>
    <text x="700" y="196" fill="#435b74" font-size="17">TCP / JSON</text>
    <rect x="60" y="246" width="360" height="72" rx="12" fill="#e0f1f3" stroke="#247984" stroke-width="2"/>
    <rect x="540" y="246" width="360" height="72" rx="12" fill="#e0f1f3" stroke="#247984" stroke-width="2"/>
    <text x="240" y="290" fill="#174e57" font-size="23" font-weight="700">モデムエミュレーター（左）</text>
    <text x="720" y="290" fill="#174e57" font-size="23" font-weight="700">モデムエミュレーター（右）</text>
    <text x="365" y="369" fill="#435b74" font-size="16">接続アダプター</text>
    <text x="845" y="369" fill="#435b74" font-size="16">接続アダプター</text>
    <rect x="60" y="408" width="360" height="78" rx="12" fill="#ffffff" stroke="#879db5" stroke-width="2"/>
    <rect x="540" y="408" width="360" height="78" rx="12" fill="#ffffff" stroke="#879db5" stroke-width="2"/>
    <text x="240" y="442" fill="#243e59" font-size="23" font-weight="700">YMIR等のエミュレーター</text>
    <text x="720" y="442" fill="#243e59" font-size="23" font-weight="700">YMIR等のエミュレーター</text>
    <text x="240" y="471" fill="#52677f" font-size="17">左端末</text>
    <text x="720" y="471" fill="#52677f" font-size="17">右端末</text>
  </g>
</svg>
