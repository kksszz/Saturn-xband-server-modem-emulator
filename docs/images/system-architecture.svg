<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title description">
  <title id="title">Saturn XBAND Server / Modem Emulator 構成図</title>
  <desc id="description">青緑色のサーバー・モデム・エミュレーター側接続モジュールが本リポジトリの対応範囲。灰色のYMIR等のエミュレーター本体は含まない。接続モジュールはYMIR向け参考ソースであり、本体へ別途組み込む必要がある。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52677f"/>
    </marker>
  </defs>
  <rect width="960" height="650" rx="20" fill="#f5f8fc"/>
  <g font-family="'Yu Gothic', 'Meiryo', 'Noto Sans JP', sans-serif" text-anchor="middle">
    <rect x="70" y="12" width="20" height="20" rx="4" fill="#e0f1f3" stroke="#247984" stroke-width="2"/>
    <text x="300" y="29" fill="#174e57" font-size="17">本リポジトリに含む（ソース／生成物）</text>
    <rect x="560" y="12" width="20" height="20" rx="4" fill="#edf0f4" stroke="#879db5" stroke-width="2"/>
    <text x="730" y="29" fill="#52677f" font-size="17">含まない（外部の本体）</text>
    <rect x="310" y="48" width="340" height="98" rx="14" fill="#e0f1f3" stroke="#247984" stroke-width="2"/>
    <text x="480" y="80" fill="#174e57" font-size="26" font-weight="700">XBAND サーバー</text>
    <text x="480" y="107" fill="#174e57" font-size="16">メール・マッチング・度数・ポイント</text>
    <text x="480" y="132" fill="#174e57" font-size="15">ソース／Windows実行ファイル</text>
    <text x="260" y="196" fill="#435b74" font-size="17">TCP / JSON</text>
    <text x="700" y="196" fill="#435b74" font-size="17">TCP / JSON</text>
    <rect x="60" y="246" width="360" height="72" rx="12" fill="#e0f1f3" stroke="#247984" stroke-width="2"/>
    <rect x="540" y="246" width="360" height="72" rx="12" fill="#e0f1f3" stroke="#247984" stroke-width="2"/>
    <text x="240" y="290" fill="#174e57" font-size="23" font-weight="700">モデムエミュレーター（左）</text>
    <text x="720" y="290" fill="#174e57" font-size="23" font-weight="700">モデムエミュレーター（右）</text>
    <text x="350" y="370" fill="#435b74" font-size="16">組み込み接続</text>
    <text x="830" y="370" fill="#435b74" font-size="16">組み込み接続</text>
    <rect x="60" y="400" width="360" height="190" rx="12" fill="#edf0f4" stroke="#879db5" stroke-width="2"/>
    <rect x="540" y="400" width="360" height="190" rx="12" fill="#edf0f4" stroke="#879db5" stroke-width="2"/>
    <rect x="78" y="425" width="324" height="70" rx="9" fill="#e0f1f3" stroke="#247984" stroke-width="2"/>
    <rect x="558" y="425" width="324" height="70" rx="9" fill="#e0f1f3" stroke="#247984" stroke-width="2"/>
    <text x="240" y="453" fill="#174e57" font-size="19" font-weight="700">エミュレーター側 接続モジュール</text>
    <text x="720" y="453" fill="#174e57" font-size="19" font-weight="700">エミュレーター側 接続モジュール</text>
    <text x="240" y="479" fill="#174e57" font-size="16">YMIR向けアダプターの参考ソース</text>
    <text x="720" y="479" fill="#174e57" font-size="16">YMIR向けアダプターの参考ソース</text>
    <text x="240" y="535" fill="#435b74" font-size="23" font-weight="700">YMIR等のエミュレーター</text>
    <text x="720" y="535" fill="#435b74" font-size="23" font-weight="700">YMIR等のエミュレーター</text>
    <text x="240" y="567" fill="#52677f" font-size="16">左端末：本体は対象外・別途組み込み</text>
    <text x="720" y="567" fill="#52677f" font-size="16">右端末：本体は対象外・別途組み込み</text>
    <text x="480" y="628" fill="#52677f" font-size="16">接続モジュールは本体へ組み込む一部分です。本体・ROM・BIOSは同梱しません。</text>
  </g>
  <g fill="none" stroke="#52677f" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)">
    <path d="M 380 158 L 240 236"/>
    <path d="M 580 158 L 720 236"/>
    <path d="M 240 328 L 240 414"/>
    <path d="M 720 328 L 720 414"/>
  </g>
</svg>
